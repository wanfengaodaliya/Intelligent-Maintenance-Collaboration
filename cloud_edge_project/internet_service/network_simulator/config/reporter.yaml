reporter:
  enabled: true
  reporter_id: network-controller-01
  # Batch endpoint: one POST per report carries ALL links. The Scheduler
  # validates and writes each link individually and returns per-link
  # accepted/rejected results (accepted=false means at least one link failed).
  scheduler_url: "http://host.docker.internal:8003/scheduler/network-reports"
  report_interval_seconds: 1
  connect_timeout_seconds: 1
  read_timeout_seconds: 2
  retry_count: 3
  backoff_base_seconds: 0.2
  queue_capacity: 5
  queue_overflow_policy: drop_oldest
  report_only_enabled_links: true
  auth:
    mode: none
    token_env: NETWORK_REPORT_TOKEN
