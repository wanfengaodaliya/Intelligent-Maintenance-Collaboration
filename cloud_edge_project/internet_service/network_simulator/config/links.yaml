toxiproxy:
  api_base_url: "http://toxiproxy:8474"
  connect_timeout_seconds: 1
  read_timeout_seconds: 2
  retry_count: 3
  backoff_base_seconds: 0.2
  startup_wait_seconds: 30

controller:
  update_interval_seconds: 1
  initial_state: GOOD
  refresh_parameters_when_state_unchanged: true
  clear_toxics_on_exit: true
  max_parallel_updates: 8

availability:
  disconnected_is_unavailable: true
  max_consecutive_apply_failures: 3
  stale_after_seconds: 3

link_generation:
  mode: cartesian
  protocol: mqtt
  id_template: "{sender_id}__to__{edge_id}__mqtt"
  proxy_name_template: "{sender_id}__to__{edge_id}__mqtt"
  listen_host: "0.0.0.0"
  seed_offset_start: 1
  latency_stream: upstream
  bandwidth_stream: upstream
  disconnect_stream: upstream
  disconnect_mode: auto
  report_enabled: true

# Supplemental HTTP links may be listed here. Sender→Edge links are generated
# from entities.yaml and must not be duplicated in cartesian mode.
links: []

# Pending supplemental HTTP links
# --------------------------------
# These templates are intentionally commented out so the current configuration
# remains valid while business service names and ports are still unknown.
# To enable one link:
#   1. Replace every <TODO_...> value in that link.
#   2. Use the same numeric port in listen and advertised_port.
#   3. Uncomment the complete YAML item.
#   4. Expose the proxy port in docker-compose.yml when a host process needs it.
# Docker services call toxiproxy:<proxy-port>; host processes call
# 127.0.0.1:<published-proxy-port>.

