toxiproxy:
  api_base_url: "http://toxiproxy:8474"
  connect_timeout_seconds: 1
  read_timeout_seconds: 2
  retry_count: 3
  backoff_base_seconds: 0.2
  startup_wait_seconds: 30

controller:
  update_interval_seconds: 1
  initial_state: GOOD
  refresh_parameters_when_state_unchanged: true
  clear_toxics_on_exit: true
  max_parallel_updates: 8

availability:
  disconnected_is_unavailable: true
  max_consecutive_apply_failures: 3
  stale_after_seconds: 3

link_generation:
  mode: cartesian
  protocol: mqtt
  id_template: "{sender_id}__to__{edge_id}__mqtt"
  proxy_name_template: "{sender_id}__to__{edge_id}__mqtt"
  listen_host: "0.0.0.0"
  seed_offset_start: 1
  latency_stream: upstream
  bandwidth_stream: upstream
  disconnect_stream: upstream
  disconnect_mode: auto
  report_enabled: true

# Sender-to-Edge MQTT links are generated from entities.yaml. These explicit
# HTTP links map the communication directions that exist in the current code.
links:
  - link_id: sender_01__to__scheduler__http
    link_type: sender_to_scheduler
    sender_id: sender_01
    protocol: http
    proxy_name: sender_01__to__scheduler__http
    listen: "0.0.0.0:18031"
    advertised_host: toxiproxy
    advertised_port: 18031
    upstream: "host.docker.internal:8003"
    seed_offset: 101
    disconnect_mode: auto
    report_enabled: true

  - link_id: sender_02__to__scheduler__http
