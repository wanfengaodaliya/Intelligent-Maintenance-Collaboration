<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设备决策与仲裁 · 智能运维协作平台</title>
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="page-header">
      <div>
        <h1>设备决策与仲裁</h1>
        <div class="desc">按设备和时间自动读取云端数据库；普通设备决策与冲突仲裁分开展示</div>
      </div>
    </div>

    <div class="card usage-tip">
      <div class="usage-title">💡 两类记录有什么区别？</div>
      <div class="usage-grid">
        <div><b>设备最终决策</b><br>每个诊断轮次闭合后都会保存，包含设备状态、动作、置信度和是否冲突。</div>
        <div><b>冲突仲裁</b><br>只有 <code>has_conflict=true</code> 并实际调用云端仲裁后才会产生，数量可能为 0。</div>
        <div><b>怎么查看</b><br>页面每 5 秒自动刷新；可输入设备 ID 筛选，点击任意记录查看完整字段。</div>
        <div><b>数据来源</b><br>直接读取 Cloud SQLite 已保存 JSON，不使用浏览器模拟数据。</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">记录筛选 <span class="hint" id="refreshMeta">等待刷新…</span></div>
      <div class="form-row">
        <label class="field">设备 ID
          <input type="text" id="deviceFilter" placeholder="留空显示全部，例如 machine_02" style="width:260px;">
        </label>
        <button class="btn" id="refreshBtn">刷新记录</button>
      </div>
    </div>

    <div class="grid grid-2">
      <div class="card">
        <div class="card-title">最近设备决策 <span class="hint">真实轮次结果</span></div>
        <div id="decisionList" style="max-height:560px;overflow:auto;"><div class="empty">加载中…</div></div>
      </div>
      <div class="card">
        <div class="card-title">冲突仲裁记录 <span class="hint">仅真实冲突</span></div>
        <div id="arbitrationList" style="max-height:560px;overflow:auto;"><div class="empty">加载中…</div></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">按冲突 ID 精确查询 <span class="hint">可选</span></div>
      <div class="form-row">
        <label class="field">conflict_id
          <input type="text" id="conflictId" placeholder="已有 conflict_id 时可直接定位" style="width:300px;">
        </label>
        <button class="btn ghost" id="queryBtn">查询</button>
      </div>
    </div>

    <div class="card" id="detailCard" style="display:none;">
      <div class="card-title">记录详情 <span class="hint" id="detailTitle"></span></div>
      <div id="detailBox"></div>
    </div>
  </main>
</div>
<script src="js/common.js"></script>
<script>
"use strict";

let decisionItems = [];
let arbitrationItems = [];

function fmtNs(value) {
  const ns = Number(value);
  if (!Number.isFinite(ns) || ns <= 0) return "-";
  return new Date(ns / 1e6).toLocaleString("zh-CN", { hour12: false });
}

function kvRows(pairs) {
  return '<div class="kv">' + pairs.map(
    ([k, v]) => '<div class="k">' + k + '</div><div class="v wrap">' +
      (v === null || v === undefined || v === "" ? "-" : v) + "</div>"
  ).join("") + "</div>";
}

function stateBadge(state) {
  return badge(fmt.stateText(state), fmt.stateClass(state));
}

function renderDecisionList(items) {
  if (!items.length) {
    el("decisionList").innerHTML = '<div class="empty">暂无设备决策记录</div>';
    return;
  }
  el("decisionList").innerHTML = items.map((item, index) => {
    const state = item.final_state || item.status || "-";
    const conflict = item.has_conflict ? badge("存在冲突", "danger") : badge("无冲突", "ok");
    return '<div class="item" role="button" tabindex="0" onclick="showDecision(' + index + ')">' +
      '<span class="time">' + fmt.escape(fmtNs(item.closed_at_ns || item.created_at_ns)) + '</span>' +
      '<div class="body"><div class="row1">' + stateBadge(state) + conflict +
      '设备 <b>' + fmt.escape(item.device_id || "-") + '</b></div>' +
      '<div class="row2">任务 ' + fmt.escape(item.task_id || "-") +
      ' · 置信度 ' + fmt.pct(item.confidence) +
      ' · ' + fmt.escape(item.result_id || "-") + '</div></div></div>';
  }).join("");
}

function renderArbitrationList(items) {
  if (!items.length) {
    el("arbitrationList").innerHTML = '<div class="empty">暂无冲突仲裁记录</div>';
    return;
  }
  el("arbitrationList").innerHTML = items.map((item, index) => {
    const deviceId = item.device_id || item.subject_id || "-";
    return '<div class="item" role="button" tabindex="0" onclick="showArbitration(' + index + ')">' +
      '<span class="time">' + fmt.escape(fmtNs(item.created_at_ns)) + '</span>' +
      '<div class="body"><div class="row1">' + badge("已仲裁", "warn") +
      '设备 <b>' + fmt.escape(deviceId) + '</b></div>' +
      '<div class="row2">冲突 ' + fmt.escape(item.conflict_id || "-") +
      ' · 动作 ' + fmt.escape(item.final_action || "-") +
      ' · 置信度 ' + fmt.pct(item.confidence) + '</div></div></div>';
  }).join("");
}

function showRecord(title, item, pairs) {
  el("detailCard").style.display = "";
  el("detailTitle").textContent = title;
  el("detailBox").innerHTML = kvRows(pairs) + jsonDetails(item, "查看完整 JSON");
}

function showDecision(index) {
  const item = decisionItems[index];
  if (!item) return;
  showRecord("设备决策 " + (item.result_id || ""), item, [
    ["设备 ID", fmt.escape(item.device_id || "-")],
    ["任务 ID", fmt.escape(item.task_id || "-")],
    ["轮次 ID", fmt.escape(item.decision_round_id || "-")],
    ["最终状态", stateBadge(item.final_state || item.status)],
    ["最终动作", fmt.escape(item.final_action || "-")],
    ["是否冲突", item.has_conflict ? badge("是", "danger") : badge("否", "ok")],
    ["记录时间", fmt.escape(fmtNs(item.closed_at_ns || item.created_at_ns))],
  ]);
}

function showArbitration(index) {
  const item = arbitrationItems[index];
  if (!item) return;
  showRecord("冲突仲裁 " + (item.arbitration_id || ""), item, [
    ["设备 ID", fmt.escape(item.device_id || item.subject_id || "-")],
    ["冲突 ID", fmt.escape(item.conflict_id || "-")],
    ["任务 ID", fmt.escape(item.task_id || "-")],
    ["仲裁状态", fmt.escape(item.status || "-")],
    ["最终动作", fmt.escape(item.final_action || "-")],
    ["置信度", fmt.pct(item.confidence)],
    ["记录时间", fmt.escape(fmtNs(item.created_at_ns))],
  ]);
}

async function refreshRecords() {
  const deviceId = el("deviceFilter").value.trim();
  const query = "?limit=50" + (deviceId ? "&device_id=" + encodeURIComponent(deviceId) : "");
  try {
    const [decisions, arbitrations] = await Promise.all([
      Api.get("cloud/cloud/device-decision-results/recent" + query),
      Api.get("cloud/cloud/device-arbitration/recent" + query),
    ]);
    decisionItems = decisions.items || [];
    arbitrationItems = arbitrations.items || [];
    renderDecisionList(decisionItems);
    renderArbitrationList(arbitrationItems);
    el("refreshMeta").textContent = "刷新于 " + new Date().toLocaleTimeString("zh-CN", { hour12: false });
  } catch (error) {
    el("decisionList").innerHTML = '<div class="empty">读取失败：' + fmt.escape(error.message) + '</div>';
    el("arbitrationList").innerHTML = '<div class="empty">读取失败：' + fmt.escape(error.message) + '</div>';
  }
}

async function queryArbitration() {
  const id = el("conflictId").value.trim();
  if (!id) { toast("请输入冲突 ID", "warn"); return; }
  try {
    const item = await Api.get("cloud/cloud/device-arbitration/" + encodeURIComponent(id));
    arbitrationItems = [item];
    showArbitration(0);
  } catch (error) {
    toast(error.status === 404 ? "未找到该冲突 ID 的仲裁记录" : "查询失败：" + error.message, "warn");
  }
}

el("refreshBtn").addEventListener("click", refreshRecords);
el("deviceFilter").addEventListener("keydown", (event) => { if (event.key === "Enter") refreshRecords(); });
el("queryBtn").addEventListener("click", queryArbitration);
el("conflictId").addEventListener("keydown", (event) => { if (event.key === "Enter") queryArbitration(); });

startPolling(refreshRecords, 5000);
</script>
</body>
</html>
