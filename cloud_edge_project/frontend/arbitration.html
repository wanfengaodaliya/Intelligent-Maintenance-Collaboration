<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设备仲裁 · 智能运维协作平台</title>
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="page-header">
      <div>
        <h1>设备仲裁</h1>
        <div class="desc">边缘与云端诊断结论冲突时，由 Scheduler 路由到 Cloud 进行仲裁复核</div>
      </div>
    </div>

    <!-- 流程说明 -->
    <div class="card">
      <div class="card-title">仲裁流程</div>
      <div class="steps">
        <div class="step"><div class="idx">①</div>边缘聚合出结论</div>
        <div class="step"><div class="idx">②</div>云端复核结论</div>
        <div class="step"><div class="idx">③</div>发现冲突（has_conflict）</div>
        <div class="step"><div class="idx">④</div>Scheduler 路由仲裁</div>
        <div class="step"><div class="idx">⑤</div>Cloud 出最终裁定</div>
      </div>
      <div style="font-size:11.5px;color:var(--text-dim);">
        仲裁记录由系统自动产生。发生冲突时诊断结果中 has_conflict=true，并在总览大屏的实时流中标记。
        此处可按冲突 ID 查询仲裁详情。
      </div>
    </div>

    <!-- 查询 -->
    <div class="card">
      <div class="card-title">查询仲裁记录</div>
      <div class="form-row">
        <label class="field">冲突 ID（conflict_id）
          <input type="text" id="conflictId" placeholder="例如 arb_20260820_0001" style="width:280px;">
        </label>
        <button class="btn" id="queryBtn">查询仲裁详情</button>
      </div>
    </div>

    <!-- 详情 -->
    <div class="card" id="arbCard" style="display:none;">
      <div class="card-title">仲裁详情 <span class="hint" id="arbTitle"></span></div>
      <div id="arbDetail"></div>
    </div>
  </main>
</div>
<script src="js/common.js"></script>
<script>
"use strict";

function kvRows(pairs) {
  return '<div class="kv">' + pairs.map(
    ([k, v]) => '<div class="k">' + k + '</div><div class="v wrap">' + (v === null || v === undefined ? "-" : v) + "</div>"
  ).join("") + "</div>";
}

async function queryArbitration() {
  const id = el("conflictId").value.trim();
  if (!id) { toast("请输入冲突 ID", "warn"); return; }
  try {
    const data = await Api.get("cloud/cloud/device-arbitration/" + encodeURIComponent(id));
    const a = data.result || data.arbitration || data;
    el("arbCard").style.display = "";
    el("arbTitle").textContent = "conflict_id = " + id;

    const finalState = a.final_state || a.final_result || a.verdict;
    const edgeState = a.edge_state || (a.edge_result && a.edge_result.final_state);
    const cloudState = a.cloud_state || (a.cloud_result && a.cloud_result.final_state);

    let html = "";

    // 边缘 vs 云端对比
    html += '<div class="grid grid-2" style="margin-bottom:12px;">';
    html += '<div class="card" style="margin-bottom:0;"><div class="card-title">边缘结论</div>' +
      '<div style="font-size:18px;font-weight:700;">' + badge(fmt.stateText(edgeState), fmt.stateClass(edgeState)) + "</div>" +
      '<div class="sub" style="font-size:11.5px;color:var(--text-dim);margin-top:6px;">置信度 ' +
      fmt.pct(a.edge_confidence ?? (a.edge_result && a.edge_result.confidence)) + "</div></div>";
    html += '<div class="card" style="margin-bottom:0;"><div class="card-title">云端复核结论</div>' +
      '<div style="font-size:18px;font-weight:700;">' + badge(fmt.stateText(cloudState), fmt.stateClass(cloudState)) + "</div>" +
      '<div class="sub" style="font-size:11.5px;color:var(--text-dim);margin-top:6px;">置信度 ' +
      fmt.pct(a.cloud_confidence ?? (a.cloud_result && a.cloud_result.confidence)) + "</div></div>";
    html += "</div>";

    // 最终裁定
    html += '<div class="card" style="margin-bottom:12px;border-left:3px solid var(--accent);"><div class="card-title">最终裁定</div>' +
      '<div style="display:flex;align-items:center;gap:12px;">' +
      badge(fmt.stateText(finalState), fmt.stateClass(finalState)) +
      '<span style="font-size:12.5px;color:var(--text-muted);">' +
      fmt.escape(String(a.arbitration_reason || a.reason || "依据云端复核与置信度综合裁定")) + "</span></div></div>";

    // 元数据
    html += kvRows([
      ["设备 ID", fmt.escape(String(a.device_id ?? "-"))],
      ["任务 ID", fmt.escape(String(a.task_id ?? "-"))],
      ["轮次 ID", fmt.escape(String(a.decision_round_id ?? "-"))],
      ["仲裁状态", fmt.escape(String(a.status ?? "-"))],
      ["创建时间", a.created_at ? fmt.escape(String(a.created_at).replace("T", " ").slice(0, 19)) : "-"],
    ]);

    html += jsonDetails(data, "查看仲裁完整 JSON");
    el("arbDetail").innerHTML = html;
  } catch (e) {
    if (e.status === 404) {
      toast("未找到该冲突 ID 的仲裁记录", "warn");
    } else {
      toast("查询失败：" + e.message, "danger");
    }
  }
}

el("queryBtn").addEventListener("click", queryArbitration);
el("conflictId").addEventListener("keydown", (ev) => { if (ev.key === "Enter") queryArbitration(); });
</script>
</body>
</html>
