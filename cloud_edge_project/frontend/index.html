<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>总览大屏 · 智能运维协作平台</title>
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="page-header">
      <div>
        <h1>总览大屏</h1>
        <div class="desc">实时诊断结果 / 维护建议 / 数据包推送（MQTT），服务健康每 5 秒轮询</div>
      </div>
      <div class="conn" id="mqttConn"><span class="led"></span><span>MQTT 实时流</span></div>
    </div>

    <!-- 第一层：核心 KPI（5 张，含准确率） -->
    <div class="hero hero-5" id="heroKpi"></div>

    <!-- 第二层：吞吐趋势图 + 服务健康 -->
    <div class="grid grid-main">
      <div class="card">
        <div class="card-title">实时吞吐趋势 <span class="hint">近 5 分钟 · 每 5 秒采样</span></div>
        <div class="chart-box"><canvas id="trendChart"></canvas></div>
        <div class="chart-legend">
          <span class="lg"><i style="background:#d97706"></i>唯一数据包</span>
          <span class="lg"><i style="background:#2563eb"></i>诊断结果</span>
          <span class="lg"><i style="background:#0d9488"></i>维护建议</span>
        </div>
      </div>
      <div class="card">
        <div class="card-title">服务健康 <span class="hint">每 5 秒轮询</span></div>
        <div class="svc-list" id="serviceList"></div>
      </div>
    </div>

    <!-- 第三层：实时明细流 -->
    <div class="section-label">实时明细流 <span class="count">MQTT</span></div>
    <div class="grid grid-3">
      <div class="card">
        <div class="card-title">
          诊断结果
          <span class="hint">每次边缘推理的结论</span>
        </div>
        <div class="stream" id="resultStream"></div>
      </div>
      <div class="card">
        <div class="card-title">
          维护建议
          <span class="hint">系统自动生成的维护建议</span>
        </div>
        <div class="stream" id="suggestionStream"></div>
      </div>
      <div class="card">
        <div class="card-title">
          数据包
          <span class="hint">传感器原始数据推送</span>
        </div>
        <div class="stream" id="packetStream"></div>
      </div>
    </div>

    <!-- 第四层：设备最终处置 + 云端模型更新建议（并列 2 列） -->
    <div class="section-label">汇总与决策输出 <span class="count">评委一眼看完</span></div>
    <div class="grid grid-2">
      <div class="card">
        <div class="card-title">
          设备最终处置
          <span class="hint" id="deviceSummaryHint">按设备聚合诊断结论</span>
        </div>
        <div id="deviceVerdict" class="verdict-list">
          <div class="empty">暂无诊断数据</div>
        </div>
      </div>
      <div class="card">
        <div class="card-title">
          云端模型更新建议书
          <span class="hint" id="muSummaryHint">来自云端 LLM（vLLM / llama.cpp）</span>
        </div>
        <div id="modelUpdateList" class="mu-list">
          <div class="empty">暂无云端模型更新任务</div>
        </div>
      </div>
    </div>

  </main>
</div>
<script src="js/common.js"></script>
<script>
"use strict";

/* ================= 配色 ================= */
const C = { blue: "#2563eb", teal: "#0d9488", gold: "#d97706", danger: "#dc2626", ok: "#16a34a", violet: "#7c3aed" };

/* ================= 本次前端运行数据 ================= */
const streamData = { result: [], suggestion: [], packet: [] };

/* ================= Hero KPI ================= */

const KPIS = [
  { id: "results",     label: "诊断总数",     unit: "条", cls: "c-blue",   color: C.blue },
  { id: "faults",      label: "故障检出",     unit: "条", cls: "c-danger", color: C.danger },
  { id: "accuracy",    label: "二分类准确率", unit: "%", cls: "c-green", color: C.ok },
  { id: "faultRate",   label: "故障占比",     unit: "%", cls: "c-gold",  color: C.gold },
  { id: "packets",     label: "唯一数据包数", unit: "个", cls: "c-violet", color: C.violet },
];

const stats = {
  results: 0,
  faults: 0,
  suggestions: 0,
  packets: 0,
  packet_receipts: 0,
  packet_duplicates: 0,
};
const evaluation = { available: true, accuracy: null, correct: 0, total: 0 };


/* ================= 5 秒分桶 ================= */

const BUCKET_MS = 5000;
const MAX_BUCKETS = 60;
const series = { packets: [], results: [], faults: [], suggestions: [] };
const bucketTimes = [];

/* ================= KPI / 系列 / 明细流 sessionStorage 持久化 ================= */

const STORAGE_KEY = "imc.index.snapshot.v1";

function saveSnapshot() {
  try {
    const payload = JSON.stringify({
      savedAt: Date.now(),
      stats,
      evaluation,
      series,
      bucketTimes,
      streamData,
    });
    sessionStorage.setItem(STORAGE_KEY, payload);
  } catch (_) {
    // sessionStorage 满或禁用时静默失败，不影响实时渲染
  }
}

function restoreSnapshot() {
  try {
    const raw = sessionStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data || typeof data !== "object") return false;

    // —— 恢复 KPI 计数 ——
    const savedStats = data.stats || {};
    Object.keys(stats).forEach((k) => {
      const v = Number(savedStats[k]);
      stats[k] = Number.isFinite(v) && v >= 0 ? v : 0;
    });

    // —— 恢复准确率上一次显示值 ——
    const savedEval = data.evaluation || {};
    ["available", "accuracy", "correct", "total"].forEach((k) => {
      if (k in savedEval) evaluation[k] = savedEval[k];
    });
    if ("min_samples_required" in savedEval) evaluation.min_samples_required = savedEval.min_samples_required;
    if ("insufficient_samples" in savedEval) evaluation.insufficient_samples = savedEval.insufficient_samples;

    // —— 恢复分桶序列 ——
    Object.keys(series).forEach((k) => { series[k] = []; });
    bucketTimes.length = 0;
    const savedBuckets = Array.isArray(data.bucketTimes) ? data.bucketTimes : [];
    const savedSeries = data.series || {};
    const nowMs = Date.now();
    const cutoffMs = nowMs - MAX_BUCKETS * BUCKET_MS;
    savedBuckets.forEach((ts, idx) => {
      if (ts < cutoffMs) return;
      bucketTimes.push(Number(ts));
      Object.keys(series).forEach((k) => {
        const s = savedSeries[k] || [];
        const v = Number(s[idx]);
        series[k].push(Number.isFinite(v) && v >= 0 ? v : 0);
      });
    });

    // —— 恢复明细流 ——
    Object.keys(streamData).forEach((k) => {
      streamData[k] = Array.isArray(data.streamData && data.streamData[k])
        ? data.streamData[k].slice(-MAX_STREAM)
        : [];
    });
    return true;
  } catch (_) {
    return false;
  }
}

function replayStreamFromStorage() {
  const resultEl = el("resultStream");
  const suggestionEl = el("suggestionStream");
  const packetEl = el("packetStream");
  [resultEl, suggestionEl, packetEl].forEach((c) => { if (c) c.innerHTML = ""; });
  deviceLast.clear();
  deviceLastSug.clear();

  if (streamData.result.length) {
    streamData.result.slice().reverse().forEach((r) => {
      if (!r || !r.ts) return;
      recomputeDeviceVerdict(r);
      prepend(resultEl, renderResultItem(r), null, null);
    });
  } else {
    showEmpty(resultEl, "等待实时诊断结果…（需 Sender 发送数据）");
  }

  if (streamData.suggestion.length) {
    streamData.suggestion.slice().reverse().forEach((r) => {
      if (!r || !r.ts) return;
      rememberDeviceSuggestion(r);
      prepend(suggestionEl, renderSuggestionItem(r), null, null);
    });
  } else {
    showEmpty(suggestionEl, "等待维护建议…");
  }

  if (streamData.packet.length) {
    streamData.packet.slice().reverse().forEach((r) => {
      if (!r || !r.ts) return;
      prepend(packetEl, renderPacketItem(r), null, null);
    });
  } else {
    showEmpty(packetEl, "等待传感器数据包…");
  }
}

let _snapshotTimer = null;
function scheduleSnapshot() {
  if (_snapshotTimer) return;
  _snapshotTimer = setTimeout(() => {
    _snapshotTimer = null;
    saveSnapshot();
  }, 80);
}

function appendEmptyBucket(timestampMs) {
  bucketTimes.push(timestampMs);
  Object.keys(series).forEach((key) => series[key].push(0));
  if (bucketTimes.length > MAX_BUCKETS) {
    bucketTimes.shift();
    Object.keys(series).forEach((key) => series[key].shift());
  }
}

function ensureBucket(timestampSeconds) {
  const aligned = Math.floor(Number(timestampSeconds) * 1000 / BUCKET_MS) * BUCKET_MS;
  const existing = bucketTimes.indexOf(aligned);
  if (existing >= 0) return existing;
  const last = bucketTimes.length ? bucketTimes[bucketTimes.length - 1] : null;
  if (last !== null && aligned < last) return -1;
  const first = last === null ? aligned : Math.max(last + BUCKET_MS, aligned - (MAX_BUCKETS - 1) * BUCKET_MS);
  for (let t = first; t <= aligned; t += BUCKET_MS) appendEmptyBucket(t);
  return bucketTimes.length - 1;
}

function addBucketValue(timestampSeconds, key) {
  const index = ensureBucket(timestampSeconds);
  if (index >= 0) series[key][index]++;
}

function renderHero() {
  el("heroKpi").innerHTML = KPIS.map((k) =>
    '<div class="kpi ' + k.cls + '" id="kpi-' + k.id + '">' +
    '<div class="label">' + k.label + '<span class="tag">实时</span></div>' +
    '<div class="value"><span id="kpi-val-' + k.id + '">0</span><span class="unit">' + k.unit + "</span></div>" +
    '<div class="spark"><canvas id="kpi-spark-' + k.id + '"></canvas></div>' +
    '<div class="sub" id="kpi-sub-' + k.id + '">' +
    (k.id === "packets" ? "本次前端运行" : "等待数据…") + "</div>" +
    "</div>"
  ).join("");
}

function setKpiVal(id, v) {
  const node = el("kpi-val-" + id);
  if (!node || node.textContent === String(v)) return;
  node.textContent = v;
  const box = node.parentElement;
  box.classList.remove("bump");
  void box.offsetWidth;
  box.classList.add("bump");
}

function updateKpis() {
  KPIS.forEach((k) => {
    if (k.id === "accuracy") {
      const hasResult = evaluation.available
        && evaluation.total > 0
        && !evaluation.insufficient_samples
        && typeof evaluation.accuracy === "number";
      setKpiVal(k.id, hasResult ? (evaluation.accuracy * 100).toFixed(1) : "—");
      const sub = el("kpi-sub-accuracy");
      if (sub) {
        if (!evaluation.available) {
          sub.textContent = "评估数据不可用";
        } else if (evaluation.total === 0) {
          sub.textContent = "等待已知标签结果…";
        } else if (evaluation.insufficient_samples) {
          sub.textContent = "样本不足（" + evaluation.total + " 条，需 ≥ " + evaluation.min_samples_required + "）";
        } else {
          sub.textContent = "已评测 " + evaluation.total + " 个轴承（正确 " + evaluation.correct + "）";
        }
      }
    } else if (k.id === "faultRate") {
      // 故障占比
      const rate = stats.results > 0 ? (stats.faults / stats.results) * 100 : 0;
      setKpiVal(k.id, rate.toFixed(1));
    } else if (k.id === "packets") {
      setKpiVal(k.id, stats.packets);
    } else {
      setKpiVal(k.id, stats[k.id] || 0);
    }
  });
  scheduleSnapshot();
}

function deltaHtml(key) {
  const s = series[key];
  if (!s.length) return "等待数据…";
  const cur = s.slice(-12).reduce((a, b) => a + b, 0);
  const prev = s.slice(-24, -12).reduce((a, b) => a + b, 0);
  if (cur === 0 && prev === 0) return "近 1 分钟无新增";
  if (prev === 0) return '近 1 分钟 <span class="up">+' + cur + "</span>";
  const pct = Math.round(((cur - prev) / prev) * 100);
  const cls = pct >= 0 ? "up" : "down";
  const arrow = pct >= 0 ? "▲" : "▼";
  return '近 1 分钟 ' + cur + ' <span class="' + cls + '">' + arrow + " " + Math.abs(pct) + "%</span>";
}

/* ================= Canvas 绘制 ================= */

function setupCanvas(canvas, cssH) {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || canvas.parentElement.clientWidth || 300;
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(cssH * dpr);
  canvas.style.height = cssH + "px";
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w, h: cssH };
}

function drawSpark(canvas, data, color) {
  if (!canvas || !data.length) return;
  const { ctx, w, h } = setupCanvas(canvas, 34);
  ctx.clearRect(0, 0, w, h);
  const max = Math.max(1, ...data);
  const step = w / Math.max(1, data.length - 1);
  const y = (v) => h - 3 - (v / max) * (h - 9);

  ctx.beginPath();
  data.forEach((v, i) => (i ? ctx.lineTo(i * step, y(v)) : ctx.moveTo(0, y(v))));
  ctx.lineTo((data.length - 1) * step, h);
  ctx.lineTo(0, h);
  ctx.closePath();
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, color + "4d");
  g.addColorStop(1, color + "00");
  ctx.fillStyle = g;
  ctx.fill();

  ctx.beginPath();
  data.forEach((v, i) => (i ? ctx.lineTo(i * step, y(v)) : ctx.moveTo(0, y(v))));
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.6;
  ctx.lineJoin = "round";
  ctx.stroke();

  const lx = (data.length - 1) * step, ly = y(data[data.length - 1]);
  ctx.beginPath();
  ctx.arc(lx, ly, 2.4, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = 7;
  ctx.fill();
  ctx.shadowBlur = 0;
}

function niceMax(v) {
  if (v <= 1) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  for (const m of [1, 2, 5, 10]) if (m * p >= v) return m * p;
  return 10 * p;
}

function drawTrend() {
  const canvas = el("trendChart");
  const { ctx, w, h } = setupCanvas(canvas, 216);
  ctx.clearRect(0, 0, w, h);
  const padL = 38, padR = 12, padT = 14, padB = 24;
  const iw = w - padL - padR, ih = h - padT - padB;

  if (!bucketTimes.length) {
    ctx.fillStyle = "rgba(93,107,130,0.7)";
    ctx.font = "13px 'Segoe UI', 'Microsoft YaHei', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("等待实时数据…", w / 2, h / 2);
    return;
  }

  const lines = [
    { key: "packets", color: C.gold },
    { key: "results", color: C.blue },
    { key: "suggestions", color: C.teal },
  ];
  let max = 1;
  lines.forEach((l) => series[l.key].forEach((v) => { if (v > max) max = v; }));
  const yMax = niceMax(max);
  const len = series.packets.length;
  const x = (i) => padL + (iw * (MAX_BUCKETS - len + i)) / (MAX_BUCKETS - 1);
  const y = (v) => padT + ih * (1 - v / yMax);

  ctx.font = "10px 'Cascadia Code', Consolas, monospace";
  for (let k = 0; k <= 4; k++) {
    const Y = padT + ih * (1 - k / 4);
    ctx.strokeStyle = k === 0 ? "rgba(30,42,59,0.16)" : "rgba(30,42,59,0.06)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padL, Y);
    ctx.lineTo(w - padR, Y);
    ctx.stroke();
    const val = (yMax * k) / 4;
    ctx.fillStyle = "#8a97ab";
    ctx.textAlign = "right";
    ctx.fillText(val % 1 === 0 ? String(val) : val.toFixed(1), padL - 7, Y + 3);
  }

  ctx.textAlign = "center";
  for (let i = 0; i < len; i++) {
    if ((len - 1 - i) % 12 !== 0) continue;
    const d = new Date(bucketTimes[i]);
    const label = String(d.getMinutes()).padStart(2, "0") + ":" + String(d.getSeconds()).padStart(2, "0");
    ctx.fillStyle = "#8a97ab";
    ctx.fillText(label, x(i), h - 7);
  }

  lines.forEach((l) => {
    const data = series[l.key];
    if (!data.length) return;
    ctx.beginPath();
    data.forEach((v, i) => (i ? ctx.lineTo(x(i), y(v)) : ctx.moveTo(x(0), y(v))));
    ctx.lineTo(x(data.length - 1), padT + ih);
    ctx.lineTo(x(0), padT + ih);
    ctx.closePath();
    const g = ctx.createLinearGradient(0, padT, 0, padT + ih);
    g.addColorStop(0, l.color + "3a");
    g.addColorStop(1, l.color + "00");
    ctx.fillStyle = g;
    ctx.fill();

    ctx.beginPath();
    data.forEach((v, i) => (i ? ctx.lineTo(x(i), y(v)) : ctx.moveTo(x(0), y(v))));
    ctx.strokeStyle = l.color;
    ctx.lineWidth = 2;
    ctx.lineJoin = "round";
    ctx.stroke();

    const lx = x(data.length - 1), ly = y(data[data.length - 1]);
    ctx.beginPath();
    ctx.arc(lx, ly, 3, 0, Math.PI * 2);
    ctx.fillStyle = l.color;
    ctx.shadowColor = l.color;
    ctx.shadowBlur = 9;
    ctx.fill();
    ctx.shadowBlur = 0;
  });
}

function redrawAll() {
  drawTrend();
  KPIS.forEach((k) => {
    if (k.id === "accuracy" || k.id === "faultRate") return;
    drawSpark(el("kpi-spark-" + k.id), series[k.id], k.color);
    const sub = el("kpi-sub-" + k.id);
    if (sub) {
      sub.innerHTML = k.id === "packets"
        ? "MQTT 到达 " + stats.packet_receipts + " 次 · 重复 " + stats.packet_duplicates + " 次 · " + deltaHtml(k.id)
        : deltaHtml(k.id);
    }
  });
}

/* ================= 服务健康 ================= */

async function refreshServices() {
  const targets = [
    { key: "edge01", name: "Edge 节点 01", path: "edge01/health" },
    { key: "edge02", name: "Edge 节点 02", path: "edge02/health" },
    { key: "scheduler", name: "Scheduler 调度", path: "scheduler/health" },
    { key: "cloud", name: "Cloud 云端", path: "cloud/health" },
    { key: "summary", name: "Summary 汇总", path: "summary/health" },
  ];
  const items = await Promise.all(
    targets.map(async (t) => {
      try {
        const h = await Api.get(t.path);
        return svcItem(t, h);
      } catch (e) {
        return (
          '<div class="svc-item down"><span class="svc-led"></span>' +
          '<div class="svc-body"><div class="svc-name">' + t.name + "</div>" +
          '<div class="svc-sub">' + fmt.escape(e.message) + "</div></div>" +
          '<span class="badge danger">不可达</span></div>'
        );
      }
    })
  );
  el("serviceList").innerHTML = items.join("");
}

function svcItem(t, h) {
  const status = h.status || h.state || "ok";
  const isOk = String(status).toLowerCase() === "ok" || h.ready === true;
  let sub = "";
  const tags = [];
  if (t.key.startsWith("edge")) {
    sub = "模型 " + (h.model_version || h.model_backend || "-");
    tags.push(h.mqtt_connected ? badge("MQTT 已连接", "ok") : badge("MQTT 断开", "danger"));
    if ((h.readiness && h.readiness.ready) || h.ready) tags.push(badge("就绪", "ok"));
  } else if (t.key === "scheduler") {
    const nodes = h.edge_nodes || {};
    const total = Object.values(nodes).reduce((a, b) => a + b, 0);
    sub = "边缘节点 " + total + " 个";
  } else if (t.key === "summary") {
    sub = h.mqtt_connected ? "三轴承窗口汇总已连接" : "等待 MQTT 连接";
    tags.push(h.mqtt_connected ? badge("MQTT 已连接", "ok") : badge("MQTT 断开", "danger"));
  } else {
    sub = "模型 " + (h.model_backend || "-");
  }
  return (
    '<div class="svc-item ' + (isOk ? "ok" : "down") + '"><span class="svc-led"></span>' +
    '<div class="svc-body"><div class="svc-name">' + t.name + "</div>" +
    '<div class="svc-sub">' + fmt.escape(sub) + "</div>" +
    (tags.length ? '<div class="svc-tags">' + tags.join("") + "</div>" : "") +
    "</div>" +
    '<span class="badge ' + (isOk ? "ok" : "danger") + '">' + (isOk ? "运行中" : "异常") + "</span></div>"
  );
}

/* ================= 实时流渲染 ================= */

/* ================= 渲染函数（保存原始数据） ================= */

const MAX_STREAM = 200;

function prepend(container, html, dataKey, data) {
  const empty = container.querySelector(".empty");
  if (empty) empty.remove();
  container.insertAdjacentHTML("afterbegin", html);
  while (container.children.length > MAX_STREAM) {
    container.removeChild(container.lastChild);
  }
  // 保存原始数据
  if (dataKey && data) {
    streamData[dataKey].push(data);
    if (streamData[dataKey].length > MAX_STREAM) {
      streamData[dataKey] = streamData[dataKey].slice(-MAX_STREAM);
    }
  }
}

function renderResult(ev, countStats) {
  if (countStats === undefined) countStats = true;
  const p = ev.payload || {};
  const grade = Number(p.final_action_grade);
  const state = p.final_state || p.status || (
    Number.isFinite(grade)
      ? (grade >= 4 ? "fault" : grade >= 2 ? "warning" : "normal")
      : (p.result_status || "-")
  );
  const isFault = String(state).toLowerCase() === "fault";
  if (countStats) {
    stats.results++;
    addBucketValue(ev.ts, "results");
    if (isFault) { stats.faults++; addBucketValue(ev.ts, "faults"); }
    updateKpis();
  }
  const conf = Number(p.confidence);

  // 保存原始数据
  const record = {
    ts: ev.ts,
    state, isFault, conf,
    device_id: p.device_id,
    risk_level: p.risk_level,
    has_conflict: p.has_conflict,
    final_action_grade: p.final_action_grade,
    window_sequence: p.window_start_sequence,
    max_grade_gap: p.max_grade_gap,
    result_status: p.result_status,

}

function renderSuggestion(ev, countStats) {
  if (countStats === undefined) countStats = true;

  if (countStats) {
    stats.suggestions++;

    updateKpis();
  }

  const record = {
    ts: ev.ts,
    priority: p.priority,
    device_id: p.device_id,

function renderSuggestionItem(r) {

function renderPacket(ev, countStats) {
  if (countStats === undefined) countStats = true;
  const p = ev.payload || {};
  if (countStats) {
    stats.packet_receipts++;
    if (ev.packet_disposition === "duplicate") {
      stats.packet_duplicates++;
      updateKpis();
      redrawAll();
      return;
    }
    if (ev.packet_disposition === "invalid") {
      updateKpis();
      redrawAll();
      return;
    }
    stats.packets++;
    addBucketValue(ev.ts, "packets");
    updateKpis();
  }
  const d = p.data || {};
  const vibration = d.vibration || {};
  const speedSignal = d.shaft_speed_rpm;
  const speedValues = speedSignal && Array.isArray(speedSignal.values) ? speedSignal.values : [];

  const hasFaultHint = String(p.edge_result || p.label || "").toLowerCase() === "fault";

  const record = {
    ts: ev.ts,
    device_id: p.device_id,
    packet_id: p.packet_id,
    hasFaultHint,
    vibration_sample_count: d.vibration_sample_count ?? vibration.sample_count,
    speed: d.speed ?? (speedValues.length ? speedValues[speedValues.length - 1] : undefined),
    temperature: d.temperature ?? d.bearing_module_temperature_c,
  };

  const html = renderPacketItem(record);
  prepend(el("packetStream"), html, "packet", record);
}

function renderPacketItem(r) {

/* ================= 设备最终处置 汇总 ================= */

// key: device_id -> 最新状态快照
const deviceLast = new Map();
// key: device_id -> 最新建议（最高优先级优先）
const deviceLastSug = new Map();

function verdictGrade(isFault, state) {
  if (isFault) return 3; // 故障
  const s = String(state || "").toLowerCase();
  if (s === "warning" || s === "warn") return 2;
  if (s === "normal" || s === "ok") return 0;
  return 1; // 未知视为观察
}

function recomputeDeviceVerdict(record) {
  if (!record || !record.device_id) return;
  const prev = deviceLast.get(record.device_id);
  if (!prev) {
    deviceLast.set(record.device_id, { ...record });
    return;
  }
  // 故障 > 预警 > 未知 > 正常；同级别则用更新时间大的覆盖
  const gOld = verdictGrade(prev.isFault, prev.state);
  const gNew = verdictGrade(record.isFault, record.state);
  if (gNew > gOld || (gNew === gOld && (record.ts || 0) >= (prev.ts || 0))) {
    deviceLast.set(record.device_id, { ...record });
  }
}

function rememberDeviceSuggestion(record) {
  if (!record || !record.device_id) return;
  const priorityOrder = { urgent: 5, high: 4, medium: 3, low: 2 };
  const curr = deviceLastSug.get(record.device_id);
  const currRank = curr ? (priorityOrder[curr.priority] || 0) : 0;
  const newRank = priorityOrder[record.priority] || 0;
  if (!curr || newRank > currRank || (newRank === currRank && (record.ts || 0) >= (curr.ts || 0))) {
    deviceLastSug.set(record.device_id, { ...record });
  }
}

function renderDeviceVerdict() {
  const wrap = el("deviceVerdict");
  const devices = Array.from(deviceLast.values()).sort((a, b) => {
    // 先按状态严重度（故障在前）；同状态按更新时间新→旧
    const ga = verdictGrade(a.isFault, a.state);
    const gb = verdictGrade(b.isFault, b.state);
    if (ga !== gb) return gb - ga;
    return (b.ts || 0) - (a.ts || 0);
  });

  if (!devices.length) {
    wrap.innerHTML = '<div class="empty">暂无诊断数据</div>';
    el("deviceSummaryHint").textContent = "按设备聚合诊断结论";
    return;
  }

  let ok = 0, warn = 0, fault = 0;
  devices.forEach((d) => {
    const g = verdictGrade(d.isFault, d.state);
    if (g >= 3) fault++; else if (g >= 2) warn++; else ok++;
  });

  const urgency = fault ? "danger" : warn ? "warn" : "ok";
  const urgencyCN = fault ? "有故障设备" : warn ? "有待观察设备" : "全部正常";
  let html = (
    '<div class="verdict-summary-bar">' +
    '<b>共 ' + devices.length + ' 台设备</b>' +
    '<span class="dot-summary">🟢 健康 ' + ok + '</span>' +
    '<span class="dot-summary warn">🟡 待观察 ' + warn + '</span>' +
    '<span class="dot-summary danger">🔴 故障 ' + fault + '</span>' +
    '<span class="dot-summary ' + urgency + '">' + urgencyCN + '</span>' +
    '</div>'
  );

  devices.forEach((d) => {
    const grade = verdictGrade(d.isFault, d.state);
    const cls = grade >= 3 ? "fault" : grade >= 2 ? "warning" : "";
    const statusCls = grade >= 3 ? "danger" : grade >= 2 ? "warn" : "ok";
    const statusCN = grade >= 3 ? "⚠ 故障" : grade >= 2 ? "⚠ 预警" : "✓ 健康";
    const confHtml = d.conf ? '置信度 <b>' + (d.conf * 100).toFixed(1) + '%</b>' : '';
    const sug = deviceLastSug.get(d.device_id);
    let sugHtml = "";
    if (sug) {
      const priorityCN = { urgent: "紧急", high: "高", medium: "中", low: "低" }[sug.priority] || sug.priority || "-";
      const typeCN = ({
        "continue_operation": "继续运行", "enhanced_monitoring": "加强监测",
        "scheduled_inspection": "安排检查", "urgent_intervention": "尽快干预",
        "shutdown": "立即停机", "inspect_soon": "尽快检查",
        "schedule_maintenance": "安排维护", "immediate_shutdown": "立即停机",
        "monitor_closely": "密切监控",
      })[sug.suggestion_type] || sug.suggestion_type || "-";
      sugHtml = (
        '<div class="verdict-suggest"><b>【处置建议·' + priorityCN + '】' +
        fmt.escape(typeCN) + '</b>　' + fmt.escape(sug.suggestion || "") + '</div>'
      );
    }

    const timeHtml = d.ts ? '<span class="ts">' + fmt.timeS(d.ts) + '</span>' : "";
    const tagHtml = d.risk_level ? ('<span class="badge-muted">风险：' + ({ high: "高危", medium: "中危", low: "低危" }[d.risk_level] || d.risk_level) + '</span>') : "";
    const conflictHtml = d.has_conflict ? '<span class="badge-muted" style="color:var(--danger);border-color:rgba(220,38,38,.3)">⚠ 跨 Edge 冲突</span>' : "";

    html += (
      '<div class="verdict-item ' + cls + '">' +
        '<div><div class="verdict-status ' + statusCls + '">' + statusCN + '</div></div>' +
        '<div class="verdict-body">' +
          '<div class="verdict-device">' +
            '<span class="device-id">' + fmt.escape(d.device_id || "-") + '</span>' +
            tagHtml + conflictHtml +
          '</div>' +
          '<div class="verdict-detail">' +
            (confHtml ? confHtml + '　' : '') +
            '<span class="k">动作等级：</span>' + (d.final_action_grade ?? "-") +
            '　<span class="k">窗口：</span>' + fmt.escape(d.window_sequence || "-") +
            '　<span class="k">跨Edge偏差：</span>' + fmt.escape(d.max_grade_gap ?? "-") +
          '</div>' +
          sugHtml +
        '</div>' +
        '<div class="verdict-meta">' + timeHtml + '</div>' +
      '</div>'
    );
  });

  wrap.innerHTML = html;
  el("deviceSummaryHint").textContent = '共 ' + devices.length + ' 台·故障 ' + fault + '·健康 ' + ok;
}

// 扩展 renderResult / renderSuggestion，每次收到新数据顺便刷新设备最终处置
(function patchRenderers() {
  const _origResult = renderResult;
  renderResult = function (ev, countStats) {
    _origResult(ev, countStats);
    const p = ev.payload || {};
    const grade = Number(p.final_action_grade);
    const state = p.final_state || p.status || (
      Number.isFinite(grade)
        ? (grade >= 4 ? "fault" : grade >= 2 ? "warning" : "normal")
        : (p.result_status || "-")
    );
    const isFault = String(state).toLowerCase() === "fault";
    recomputeDeviceVerdict({
      ts: ev.ts,
      isFault,
      state,
      conf: Number(p.confidence),
      device_id: p.device_id,
      risk_level: p.risk_level,
      has_conflict: p.has_conflict,
      final_action_grade: p.final_action_grade,
      window_sequence: p.window_start_sequence,
      max_grade_gap: p.max_grade_gap,
    });
    renderDeviceVerdict();
  };
  const _origSug = renderSuggestion;
  renderSuggestion = function (ev, countStats) {
    _origSug(ev, countStats);
    const p = ev.payload || {};
    rememberDeviceSuggestion({
      ts: ev.ts,
      priority: p.priority,
      device_id: p.device_id,
      suggestion_type: p.suggestion_type,
      suggestion: p.suggestion,
    });
    renderDeviceVerdict();
  };
})();

/* ================= 云端模型更新建议书 ================= */

async function explainEmptyModelUpdates() {
  try {
    const response = await Api.get("cloud/global-analysis/recent?limit=1");
    const latest = response && Array.isArray(response.items) ? response.items[0] : null;
    if (!latest) {
      return "暂无云端模型更新任务：全局分析尚未产生结果";
    }
    const candidates = Array.isArray(latest.problem_candidates)
      ? latest.problem_candidates
      : [];
    if (candidates.some((item) => item && item.suggested_action === "model_update")) {
      return "已发现模型更新候选，等待云端生成建议书";
    }
    const packet = latest.packet_diagnosis_analysis || {};
    if (packet.status === "insufficient_data") {
      return "未触发模型更新：缺少云端复核或纠偏证据；设备故障不等于模型失准";
    }
    return "未触发模型更新：最新全局分析未发现模型偏差";
  } catch (e) {
    return "暂无云端模型更新任务：无法读取最新全局分析";
  }
}

      verifying: "验证中", ineffective: "效果不佳", partial_improvement: "部分改善",
      succeeded: "已生效", rolled_back: "已回滚", training_failed: "训练失败",

  });

  wrap.innerHTML = html;
  el("muSummaryHint").textContent = '共 ' + items.length + ' 条云端更新记录';
}

async function refreshAccuracy() {

function restoreSessionSnapshot(ev) {
  const snapshot = ev.payload || {};
  const savedStats = snapshot.stats || {};
  // Merge，不要覆盖 sessionStorage 已经累积的值（谁大用谁，保证不回退）
  Object.keys(stats).forEach((key) => {
    const incoming = Number(savedStats[key]) || 0;
    stats[key] = Math.max(stats[key], incoming);
  });

  // buckets + series 只在 sessionStorage 完全没数据时才覆盖，否则合并：以 sessionStorage 为主，后端 bucket 补齐缺失
  const incomingBuckets = snapshot.buckets || [];
  if (incomingBuckets.length && !bucketTimes.length) {
    const byTimestamp = new Map(incomingBuckets.map((bucket) => [Number(bucket.timestamp_ms), bucket]));
    const end = Number(incomingBuckets[incomingBuckets.length - 1].timestamp_ms);
    const start = Math.max(Number(incomingBuckets[0].timestamp_ms), end - (MAX_BUCKETS - 1) * BUCKET_MS);
    for (let timestamp = start; timestamp <= end; timestamp += BUCKET_MS) {
      appendEmptyBucket(timestamp);
      const bucket = byTimestamp.get(timestamp);
      if (!bucket) continue;
      Object.keys(series).forEach((key) => {
        series[key][series[key].length - 1] = Number(bucket[key]) || 0;
      });
    }
  }

  // recent 明细流只在 sessionStorage 为空时回放，避免和本地已回放的重复
  const needRecentReplay = streamData.result.length === 0 && streamData.suggestion.length === 0 && streamData.packet.length === 0;
  if (needRecentReplay) {
    Object.keys(streamData).forEach((key) => { streamData[key] = []; });
    showEmpty(el("resultStream"), "等待实时诊断结果…（需 Sender 发送数据）");
    showEmpty(el("suggestionStream"), "等待维护建议…");
    showEmpty(el("packetStream"), "等待传感器数据包…");
    const recent = snapshot.recent || {};
    (recent["device-result"] || []).forEach((item) => renderResult(item, false));
    (recent.suggestion || []).forEach((item) => renderSuggestion(item, false));
    (recent["input-packet"] || []).forEach((item) => renderPacket(item, false));
  }

  renderDeviceVerdict();
  updateKpis();
  redrawAll();
}

let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(redrawAll, 150);
});

function init() {
  renderHero();

  // 优先从 sessionStorage 恢复（0ms，切页回来立即有值，不等 MQTT/后端）
  const restored = restoreSnapshot();
  if (restored) {
    replayStreamFromStorage();
  } else {
    showEmpty(el("resultStream"), "等待实时诊断结果…（需 Sender 发送数据）");
    showEmpty(el("suggestionStream"), "等待维护建议…");
    showEmpty(el("packetStream"), "等待传感器数据包…");
  }
  renderDeviceVerdict();
  updateKpis();
  redrawAll();
  setMqttStatus(false);

  connectEvents({
    "session-snapshot": restoreSessionSnapshot,
    "device-result": renderResult,
    suggestion: renderSuggestion,
    "input-packet": renderPacket,
    "mqtt-status": (d) => setMqttStatus(!!d.connected),
  });

  // 补齐按 epoch 对齐的 5 秒空桶；实时事件直接合并到对应时间桶。
  setInterval(() => {
    ensureBucket(Date.now() / 1000);
    redrawAll();
  }, BUCKET_MS);

  refreshServices();
  startPolling(refreshServices, 5000);
  startPolling(refreshAccuracy, 5000);

  // 云端模型更新建议书：立即加载一次，然后每 10 秒刷新
  refreshModelUpdates();
  startPolling(refreshModelUpdates, 10000);
}

init();
</script>
</body>
</html>
