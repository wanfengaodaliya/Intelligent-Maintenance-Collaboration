<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>调度拓扑 · 智能运维协作平台</title>
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="page-header">
      <div>
        <h1>调度与拓扑</h1>
        <div class="desc">最近批次分配、边缘节点状态和九条 Sender 网络链路（每 5 秒刷新）</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">系统拓扑 <span class="hint">节点颜色：绿=正常 红=不可达</span></div>
      <svg class="topo-svg" viewBox="0 0 900 240" id="topoSvg"></svg>
    </div>

    <div class="grid grid-2">
      <div class="card">
        <div class="card-title">Scheduler 调度器（:8003）</div>
        <div id="schedulerBox"><div class="empty">加载中…</div></div>
      </div>
      <div class="card">
        <div class="card-title">边缘节点摘要 <span class="hint">真实 /health</span></div>
        <div id="edgeSummaryBox"><div class="empty">加载中…</div></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">九条 Sender 网络链路 <span class="hint" id="linkRefresh">刷新时间：-</span></div>
      <div id="batchMeta" class="sender-link-note">等待最近批次…</div>
      <div id="senderLinkList" class="sender-link-list"><div class="empty">加载中…</div></div>
    </div>
  </main>
</div>
<script src="js/common.js"></script>
<script src="js/topology-links.js"></script>
<script>
"use strict";

const NODES = {
  sender: { x: 60, y: 120, label: "Sender", sub: "数据发送端" },
  edge01: { x: 300, y: 60, label: "edge_01", sub: "边缘节点 :8001" },
  edge02: { x: 300, y: 180, label: "edge_02", sub: "边缘节点 :8002" },
  scheduler: { x: 560, y: 120, label: "Scheduler", sub: "调度器 :8003" },
  cloud: { x: 800, y: 120, label: "Cloud", sub: "云端 :8004" },
};

const TOPOLOGY_LINKS = [
  { from: "sender", to: "edge01", label: "MQTT" },
  { from: "sender", to: "edge02", label: "MQTT" },
  { from: "edge01", to: "scheduler", label: "HTTP" },
  { from: "edge02", to: "scheduler", label: "HTTP" },
  { from: "scheduler", to: "cloud", label: "云端" },
];

const nodeStatus = {};
const edgeHealth = {};
let latestBatch = { items: [] };
let networkLinks = [];
let refreshedAt = null;
let batchLoadError = null;

function drawTopo() {
  const svg = el("topoSvg");
  let html = "";
  TOPOLOGY_LINKS.forEach((link) => {
    const from = NODES[link.from], to = NODES[link.to];
    const down = nodeStatus[link.from] === "down" || nodeStatus[link.to] === "down";
    html += '<line class="link ' + (down ? "dead" : "active") + '" x1="' + (from.x + 70) +
      '" y1="' + from.y + '" x2="' + (to.x - 70) + '" y2="' + to.y + '"/>';
    html += '<text class="link-label" x="' + (((from.x + 70) + (to.x - 70)) / 2) +
      '" y="' + ((from.y + to.y) / 2 - 8) + '" text-anchor="middle">' + link.label + "</text>";
  });
  Object.entries(NODES).forEach(([id, node]) => {
    const status = nodeStatus[id];
    const stroke = status === "down" ? "var(--danger)" : status === "ok" ? "var(--ok)" : "var(--border)";
    html += '<g class="node"><rect x="' + (node.x - 70) + '" y="' + (node.y - 28) +
      '" width="140" height="56" rx="10" style="stroke:' + stroke + '"/>' +
      '<text x="' + node.x + '" y="' + (node.y - 6) + '" text-anchor="middle">' + node.label + "</text>" +
      '<text class="sub" x="' + node.x + '" y="' + (node.y + 14) + '" text-anchor="middle">' + node.sub + "</text></g>";
  });
  svg.innerHTML = html;
}

function kvRows(pairs) {
  return '<div class="kv">' + pairs.map(([key, value]) =>
    '<div class="k">' + key + '</div><div class="v wrap">' +
    (value === null || value === undefined || value === "" ? "-" : value) + "</div>"
  ).join("") + "</div>";
}

function fmtNs(value) {
  const ns = Number(value);
  if (!Number.isFinite(ns) || ns <= 0) return "-";
  return new Date(ns / 1e6).toLocaleString("zh-CN", { hour12: false });
}

function serviceOk(health) {
  return health && (health.ready === true || String(health.status).toLowerCase() === "ok");
}

async function probe(key, path) {
  try {
    const health = await Api.get(path);
    nodeStatus[key] = serviceOk(health) ? "ok" : "warn";
    return health;
  } catch {
    nodeStatus[key] = "down";
    return null;
  }
}

function renderScheduler(health) {
  if (!health) {
    el("schedulerBox").innerHTML = '<div class="empty">Scheduler 不可达</div>';
    return;
  }
  const counts = Object.entries(health.edge_nodes || {}).map(([key, value]) => key + ": " + value).join(" · ") || "-";
  el("schedulerBox").innerHTML = kvRows([
    ["状态", serviceOk(health) ? badge("运行中", "ok") : badge(String(health.status || "异常"), "warn")],
    ["模型", fmt.escape(String(health.model_backend || "-"))],
    ["推理设备", fmt.escape(String(health.device || "-"))],
    ["边缘节点统计", fmt.escape(counts)],
  ]);
}

function edgeOutboxBacklog(health) {
  const result = Number(health && health.device_result_outbox && health.device_result_outbox.backlog) || 0;
  const suggestion = Number(health && health.suggestion_outbox && health.suggestion_outbox.backlog) || 0;
  return result + suggestion;
}

function renderEdgeSummary() {
  const rows = ["edge01", "edge02"].map((key) => {
    const health = edgeHealth[key];
    const name = key === "edge01" ? "edge_01" : "edge_02";
    if (!health) {
      return "<tr><td>" + name + "</td><td>" + badge("不可达", "danger") + '</td><td colspan="4">-</td></tr>';
    }
    const waiting = Number(health.model_queue && health.model_queue.waiting) || 0;
    const backlog = edgeOutboxBacklog(health);
    return "<tr><td>" + name + "</td><td>" + badge(serviceOk(health) ? "在线" : "降级", serviceOk(health) ? "ok" : "warn") +
      "</td><td class='trunc' title='" + fmt.escape(health.model_version || "-") + "'>" + fmt.escape(health.model_version || "-") +
      "</td><td>" + (health.mqtt_connected ? badge("已连接", "ok") : badge("断开", "danger")) +
      "</td><td class='num'>" + waiting + "</td><td class='num'>" + backlog + "</td></tr>";
  });
  el("edgeSummaryBox").innerHTML = '<div class="table-wrap"><table class="list"><thead><tr>' +
    '<th>节点</th><th>状态</th><th>模型版本</th><th>MQTT</th><th class="num">推理积压</th><th class="num">Outbox</th>' +
    "</tr></thead><tbody>" + rows.join("") + "</tbody></table></div>";
}

function stateInfo(network) {
  if (!network) return { text: "数据不可用", cls: "muted", state: "-" };
  const params = network.applied_parameters || {};
  const state = network.available === false ? "DISCONNECTED" : String(params.state || network.current_state || "-").toUpperCase();
  const mapping = {
    GOOD: ["良好", "ok"],
    MEDIUM: ["一般", "warn"],
    BAD: ["较差", "danger"],
    DISCONNECTED: ["断开", "danger"],
  };
  const value = mapping[state] || [state, "muted"];
  return { text: value[0], cls: value[1], state };
}

function displayName(row) {
  const sender = row.senderId.replace("sender_", "Sender ");
  const target = row.targetId === "scheduler" ? "Scheduler" : row.targetId.replace("edge_", "Edge ");
  return sender + " → " + target;
}

function renderLinkDetail(row) {
  if (batchLoadError) {
    return '<div class="sender-link-note">无法判断本次是否使用：' + fmt.escape(batchLoadError) + "</div>";
  }
  if (!row.used) {
    const reason = row.assignment && row.targetId !== "scheduler" && row.assignment.assignment_status !== "ASSIGNED"
      ? "本次调度未成功分配 Edge（" + fmt.escape(row.assignment.assignment_status || "-") + "）。"
      : "本次未使用该链路。";
    return '<div class="sender-link-note">' + reason + "</div>";
  }
  if (!row.network) return '<div class="sender-link-note">本次使用，但网络模拟器未返回该链路数据。</div>';
  const params = row.network.applied_parameters || {};
  const loss = Number(params.packet_loss_percent);
  return kvRows([
    ["网络状态", badge(stateInfo(row.network).text, stateInfo(row.network).cls)],
    ["延迟 / 抖动", (params.latency_ms ?? "-") + " ms / " + (params.jitter_ms ?? "-") + " ms"],
    ["带宽", params.bandwidth_kbps === null || params.bandwidth_kbps === undefined ? "-" : fmt.num(params.bandwidth_kbps) + " kbps"],
    ["模拟丢包率", Number.isFinite(loss) ? loss.toFixed(2) + "%" : "-"],
    ["可靠性分数", row.network.link_reliability_score ?? "-"],
    ["状态开始时间", fmt.escape(fmtNs(row.network.applied_state_since_ns || row.network.state_since_ns))],
    ["本次任务", row.assignment ? fmt.escape(row.assignment.task_id || "-") : "-"],
  ]);
}

function renderSenderLinks() {
  const rows = TopologyLinks.buildSenderLinkRows(networkLinks, latestBatch);
  el("senderLinkList").innerHTML = rows.map((row) => {
    const state = stateInfo(row.network);
    const stateBadge = batchLoadError
      ? badge("分配数据不可用", "danger")
      : row.used ? badge(state.text, state.cls) : badge("无", "muted");
    const usedBadge = !batchLoadError && row.used ? badge("本次使用", "ok") : "";
    return '<details class="sender-link' + (!batchLoadError && !row.used ? " unused" : "") + '"><summary>' +
      '<span class="sender-link-name">' + fmt.escape(displayName(row)) + "</span>" +
      "<span>" + usedBadge + stateBadge + "</span></summary>" +
      '<div class="sender-link-detail">' + renderLinkDetail(row) + "</div></details>";
  }).join("");
  const created = latestBatch.batch_created_timestamp_ns;
  el("batchMeta").textContent = batchLoadError
    ? "最近批次读取失败：" + batchLoadError
    : created
    ? "最近批次：设备 " + (latestBatch.device_id || "-") + " · " + fmtNs(created)
    : "暂无 Sender 调度批次";
  el("linkRefresh").textContent = "刷新时间：" + (refreshedAt ? refreshedAt.toLocaleTimeString("zh-CN", { hour12: false }) : "-");
}

async function refresh() {
  const [edge01, edge02, schedulerHealth, cloudHealth] = await Promise.all([
    probe("edge01", "edge01/health"),
    probe("edge02", "edge02/health"),
    probe("scheduler", "scheduler/health"),
    probe("cloud", "cloud/health"),
  ]);
  edgeHealth.edge01 = edge01;
  edgeHealth.edge02 = edge02;
  nodeStatus.sender = "ok";
  renderScheduler(schedulerHealth);
  renderEdgeSummary();
  drawTopo();

  const [batchResult, networkResult] = await Promise.allSettled([
    Api.get("scheduler/scheduler/assignments/recent-batch"),
    Api.get("network/api/v1/network/links"),
  ]);
  batchLoadError = batchResult.status === "rejected"
    ? String(batchResult.reason && batchResult.reason.message || "Scheduler 接口不可用")
    : null;
  latestBatch = batchResult.status === "fulfilled" ? batchResult.value : { items: [] };
  networkLinks = networkResult.status === "fulfilled" ? networkResult.value : [];
  nodeStatus.sender = !batchLoadError && latestBatch.items && latestBatch.items.length ? "ok" : "warn";
  refreshedAt = new Date();
  drawTopo();
  renderSenderLinks();
}

drawTopo();
startPolling(refresh, 5000);
</script>
</body>
</html>
