# 双边缘容器正式编排（唯一 Edge Compose 来源，已合并旧 compose.network-sim.yml
# 的网络模拟语义；该旧文件已删除，不保留兼容副本）。
#
# 前置条件：
#   1. 先以固定 Compose project name 启动网络模拟器
#      （internet_service/network_simulator，project name 必须为
#      network_simulator，默认网络名 network_simulator_default）：
#      docker compose -p network_simulator up -d
#      等待 toxiproxy / mqtt-broker / network-controller 全部 healthy。
#   2. 宿主机运行 Scheduler 8003 与 Cloud 8004（Toxiproxy 各链路的上游
#      已指向 host.docker.internal）。
#
# 使用（在 cloud_edge_project/edge_service 目录下，镜像需已构建）：
#   docker compose --env-file ../../.env -f compose.multi-edge.yml up -d --no-build
#
# 节点命名 edge_01 / edge_02 与网络模拟器 config/links.yaml 中的链路 ID
# （edge_01__to__scheduler__http 等）完全对齐，不修改网络模拟器配置。
#
# 链路走向：
#   edge_01 → Scheduler : toxiproxy:18011（宿主机 127.0.0.1:18011）
#   edge_01 → Cloud     : toxiproxy:18021（宿主机 127.0.0.1:18021）
#   edge_02 → Scheduler : toxiproxy:18051（宿主机 127.0.0.1:18051）
#   edge_02 → Cloud     : toxiproxy:18053（宿主机 127.0.0.1:18053）
#   Scheduler → edge    : 宿主机 127.0.0.1:18042/18052 → 本文件端口 8001/8002
#   Edge → 建议 LLM     : host.docker.internal:8005（宿主机 llama.cpp）
#   Sender → Edge (MQTT): 宿主机 18831/18832/18931/18932/19031/19032 → mqtt-broker
#
# 所有部署相关节点标识、地址、端口和主题均可由根目录 .env 覆盖；下面仅保留
# 本机演示拓扑的兼容默认值。
#
# 自动模型更新（Poller）默认关闭；开启前必须叠加 compose.model-update.yml
# 挂载 Ed25519 签名公钥。
#
# Scheduler 节点注册（与 node_registry.py 默认值一致，宿主机启动时无需
# 显式设置；显式设置时保持相同取值）：
#   SCHEDULER_EDGE_NODES_JSON='{"edge_01":{"control_url":"http://127.0.0.1:18042","target_topic":"edge/edge_01/input"},"edge_02":{"control_url":"http://127.0.0.1:18052","target_topic":"edge/edge_02/input"}}'
#
# 链路故障责任约定：
#   - Sender→Edge 发送失败：由 Sender/Scheduler 重调度；
#   - Edge→Cloud 复核超时：由 Edge 在业务截止时间降级为暂定结果；
#   - Scheduler→Edge 仲裁投递失败：由 Scheduler 重试回调。

services:
  edge_01:
    build:
      context: ..
      dockerfile: edge_service/Dockerfile
    image: cloud-edge/edge-service:latest
    container_name: edge_01
    extra_hosts:
      # 建议 LLM（host.docker.internal:8005）与 official 对照模型服务（8012）
      # 运行在宿主机，容器经 host-gateway 访问。
      - "host.docker.internal:host-gateway"
    environment:
      EDGE_NODE_ID: ${EDGE_01_NODE_ID:-edge_01}
      EDGE_SERVICE_HOST: ${EDGE_SERVICE_HOST:-0.0.0.0}
      EDGE_SERVICE_PORT: ${EDGE_SERVICE_PORT:-8001}
      EDGE_MQTT_HOST: ${EDGE_01_MQTT_HOST:-mqtt-broker}
      EDGE_MQTT_PORT: ${EDGE_01_MQTT_PORT:-1883}
      EDGE_MQTT_CLIENT_ID: ${EDGE_01_MQTT_CLIENT_ID:-edge_01-runtime}
      EDGE_MQTT_INPUT_TOPIC: ${EDGE_01_MQTT_INPUT_TOPIC:-edge/edge_01/input}
      EDGE_MQTT_DEVICE_RESULT_TOPIC: ${EDGE_MQTT_DEVICE_RESULT_TOPIC:-summary/device-results}
      EDGE_CONTROL_SHARED_SECRET: ${EDGE_CONTROL_SHARED_SECRET:?EDGE_CONTROL_SHARED_SECRET is required}
      EDGE_CONTROL_KEY_ID: ${EDGE_CONTROL_KEY_ID:-scheduler-v1}
      # 出站 HTTP 全部经过 Toxiproxy 链路，指向 links.yaml 中对应代理端口。
      SCHEDULER_SERVICE_BASE_URL: ${EDGE_01_SCHEDULER_SERVICE_BASE_URL:-http://toxiproxy:18011}
      CLOUD_SERVICE_BASE_URL: ${EDGE_01_CLOUD_SERVICE_BASE_URL:-http://toxiproxy:18021}
      # 设备级维护建议 LLM 运行在宿主机 llama.cpp（8005），
      # 与 Cloud 模型更新建议书的 vLLM（6006）是两套互不相干的服务。
      EDGE_SUGGESTION_LLM_BASE_URL: ${EDGE_SUGGESTION_LLM_BASE_URL:-http://host.docker.internal:8005}
      # 启动脚本 -SkipLLM 时注入 false，显式禁用建议生成的 LLM 调用；
      # 默认 true，LLM 不可达时 Edge 自行回退到模板文案。
      EDGE_SUGGESTION_LLM_ENABLED: ${EDGE_SUGGESTION_LLM_ENABLED:-true}
      # 正式诊断路线：蒸馏模型 H5 三通道并行（容器内本地推理，镜像自带 torch）。
      # 切回模型服务 HTTP 路线（故障演练矩阵）：EDGE_DIAGNOSTIC_BACKEND=official
      # 并保留 EDGE_MODEL_BASE_URL。
      EDGE_DIAGNOSTIC_BACKEND: ${EDGE_DIAGNOSTIC_BACKEND:-local_h5}
      EDGE_MODEL_ROOT: ${EDGE_MODEL_ROOT:-/app/data/models}
      EDGE_V12_DATABASE_PATH: ${EDGE_V12_DATABASE_PATH:-/app/data/edge_v12.db}
      EDGE_CLOUD_REVIEW_CACHE_DIR: ${EDGE_CLOUD_REVIEW_CACHE_DIR:-/app/data/edge_cloud_review}
      EDGE_RAW_SAMPLE_DIRECTORY: ${EDGE_RAW_SAMPLE_DIRECTORY:-/app/data/raw_analysis_samples}
      EDGE_PACKET_ROUTE_ERROR_LOG: ${EDGE_PACKET_ROUTE_ERROR_LOG:-/app/data/edge_packet_route_errors.jsonl}
      EDGE_MODEL_RUN_LOG: ${EDGE_MODEL_RUN_LOG:-/app/data/edge_model_runs.jsonl}
      EDGE_MODEL_UPDATE_POLLER_ENABLED: ${EDGE_MODEL_UPDATE_POLLER_ENABLED:-false}
      EDGE_MODEL_SIGNING_KEY_ID: ${EDGE_MODEL_SIGNING_KEY_ID:-release-v1}
      EDGE_MODEL_BASE_URL: ${EDGE_MODEL_BASE_URL:-http://host.docker.internal:8012}
      EDGE_MODEL_QUEUE_WAIT_MS: ${EDGE_MODEL_QUEUE_WAIT_MS:-250}
      EDGE_MODEL_TOTAL_TIMEOUT_MS: ${EDGE_MODEL_TOTAL_TIMEOUT_MS:-2000}
      EDGE_MODEL_INFERENCE_WORKERS: ${EDGE_MODEL_INFERENCE_WORKERS:-1}
      EDGE_TORCH_INTRAOP_THREADS: ${EDGE_TORCH_INTRAOP_THREADS:-1}
      EDGE_TORCH_INTEROP_THREADS: ${EDGE_TORCH_INTEROP_THREADS:-1}
      # 可选：pin 模型版本；与 readiness 上报不一致时本节点 readiness 不通过，
      # 调度方停止派发新任务。与 Poller 同时开启会触发配置冲突（退出码 78）。
      EDGE_MODEL_VERSION: ${EDGE_MODEL_VERSION:-}
      # 状态上报 URL 从统一基址推导，同样经过 edge→scheduler / edge→cloud 链路。
      EDGE_NETWORK_LINK_ID: ${EDGE_01_NETWORK_LINK_ID:-edge_01__to__scheduler__http}
      EDGE_NETWORK_STATUS_URL: ${EDGE_01_NETWORK_STATUS_URL:-http://network-controller:8090/api/v1/network/links/edge_01__to__scheduler__http}
      EDGE_STATUS_SCHEDULER_URL: ${EDGE_01_STATUS_SCHEDULER_URL:-http://toxiproxy:18011/scheduler/edge-nodes/status}
      EDGE_STATUS_CLOUD_URL: ${EDGE_01_STATUS_CLOUD_URL:-http://toxiproxy:18021/cloud/edge-status}
      EDGE_STATUS_INTERVAL_SECONDS: ${EDGE_STATUS_INTERVAL_SECONDS:-1.0}
      # ENV-3: 容器化 multi-edge 下资源采集使用 cgroup/container 视角，
      # 读取容器自身 quota/limit 而非宿主机 16 核 / 剩余内存。
      # 若节点运行在独立 VM 而非容器，可显式改为 system。
      EDGE_STATUS_RESOURCE_MODE: ${EDGE_STATUS_RESOURCE_MODE:-cgroup}
    ports:
      # 供 Scheduler→Edge 链路（Toxiproxy 18042 上游）回调，不映射控制端口 8011。
      - "${EDGE_01_HOST_PORT:-8001}:${EDGE_SERVICE_PORT:-8001}"
    volumes:
      - edge_01_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  edge_02:
    build:
      context: ..
      dockerfile: edge_service/Dockerfile
    image: cloud-edge/edge-service:latest
    container_name: edge_02
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      EDGE_NODE_ID: ${EDGE_02_NODE_ID:-edge_02}
      EDGE_SERVICE_HOST: ${EDGE_SERVICE_HOST:-0.0.0.0}
      EDGE_SERVICE_PORT: ${EDGE_SERVICE_PORT:-8001}
      EDGE_MQTT_HOST: ${EDGE_02_MQTT_HOST:-mqtt-broker}
      EDGE_MQTT_PORT: ${EDGE_02_MQTT_PORT:-1883}
      EDGE_MQTT_CLIENT_ID: ${EDGE_02_MQTT_CLIENT_ID:-edge_02-runtime}
      EDGE_MQTT_INPUT_TOPIC: ${EDGE_02_MQTT_INPUT_TOPIC:-edge/edge_02/input}
      EDGE_MQTT_DEVICE_RESULT_TOPIC: ${EDGE_MQTT_DEVICE_RESULT_TOPIC:-summary/device-results}
      EDGE_CONTROL_SHARED_SECRET: ${EDGE_CONTROL_SHARED_SECRET:?EDGE_CONTROL_SHARED_SECRET is required}
      EDGE_CONTROL_KEY_ID: ${EDGE_CONTROL_KEY_ID:-scheduler-v1}
      SCHEDULER_SERVICE_BASE_URL: ${EDGE_02_SCHEDULER_SERVICE_BASE_URL:-http://toxiproxy:18051}
      CLOUD_SERVICE_BASE_URL: ${EDGE_02_CLOUD_SERVICE_BASE_URL:-http://toxiproxy:18053}
      EDGE_SUGGESTION_LLM_BASE_URL: ${EDGE_SUGGESTION_LLM_BASE_URL:-http://host.docker.internal:8005}
      EDGE_SUGGESTION_LLM_ENABLED: ${EDGE_SUGGESTION_LLM_ENABLED:-true}
      EDGE_DIAGNOSTIC_BACKEND: ${EDGE_DIAGNOSTIC_BACKEND:-local_h5}
      EDGE_MODEL_ROOT: ${EDGE_MODEL_ROOT:-/app/data/models}
      EDGE_V12_DATABASE_PATH: ${EDGE_V12_DATABASE_PATH:-/app/data/edge_v12.db}
      EDGE_CLOUD_REVIEW_CACHE_DIR: ${EDGE_CLOUD_REVIEW_CACHE_DIR:-/app/data/edge_cloud_review}
      EDGE_RAW_SAMPLE_DIRECTORY: ${EDGE_RAW_SAMPLE_DIRECTORY:-/app/data/raw_analysis_samples}
      EDGE_PACKET_ROUTE_ERROR_LOG: ${EDGE_PACKET_ROUTE_ERROR_LOG:-/app/data/edge_packet_route_errors.jsonl}
      EDGE_MODEL_RUN_LOG: ${EDGE_MODEL_RUN_LOG:-/app/data/edge_model_runs.jsonl}
      EDGE_MODEL_UPDATE_POLLER_ENABLED: ${EDGE_MODEL_UPDATE_POLLER_ENABLED:-false}
      EDGE_MODEL_SIGNING_KEY_ID: ${EDGE_MODEL_SIGNING_KEY_ID:-release-v1}
      EDGE_MODEL_BASE_URL: ${EDGE_MODEL_BASE_URL:-http://host.docker.internal:8012}
      EDGE_MODEL_QUEUE_WAIT_MS: ${EDGE_MODEL_QUEUE_WAIT_MS:-250}
      EDGE_MODEL_TOTAL_TIMEOUT_MS: ${EDGE_MODEL_TOTAL_TIMEOUT_MS:-2000}
      EDGE_MODEL_INFERENCE_WORKERS: ${EDGE_MODEL_INFERENCE_WORKERS:-1}
      EDGE_TORCH_INTRAOP_THREADS: ${EDGE_TORCH_INTRAOP_THREADS:-1}
      EDGE_TORCH_INTEROP_THREADS: ${EDGE_TORCH_INTEROP_THREADS:-1}
      EDGE_MODEL_VERSION: ${EDGE_MODEL_VERSION:-}
      EDGE_NETWORK_LINK_ID: ${EDGE_02_NETWORK_LINK_ID:-edge_02__to__scheduler__http}
      EDGE_NETWORK_STATUS_URL: ${EDGE_02_NETWORK_STATUS_URL:-http://network-controller:8090/api/v1/network/links/edge_02__to__scheduler__http}
      EDGE_STATUS_SCHEDULER_URL: ${EDGE_02_STATUS_SCHEDULER_URL:-http://toxiproxy:18051/scheduler/edge-nodes/status}
      EDGE_STATUS_CLOUD_URL: ${EDGE_02_STATUS_CLOUD_URL:-http://toxiproxy:18053/cloud/edge-status}
      EDGE_STATUS_INTERVAL_SECONDS: ${EDGE_STATUS_INTERVAL_SECONDS:-1.0}
      # ENV-3: 容器化 multi-edge 下资源采集使用 cgroup/container 视角。
      EDGE_STATUS_RESOURCE_MODE: ${EDGE_STATUS_RESOURCE_MODE:-cgroup}
    ports:
      # 供 Scheduler→Edge 链路（Toxiproxy 18052 上游）回调。
      - "${EDGE_02_HOST_PORT:-8002}:${EDGE_SERVICE_PORT:-8001}"
    volumes:
      - edge_02_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  edge_01_data:
  edge_02_data:

networks:
  default:
    name: ${NETWORK_SIM_NETWORK:-network_simulator_default}
    external: true
