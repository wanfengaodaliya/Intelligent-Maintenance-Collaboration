# 多节点边缘部署（阶段 3 第一版）：同一镜像，显式定义 edge_001 与 edge_002。
# 不使用 `docker compose --scale`：每个节点的身份、Topic、客户端 ID 和数据卷必须唯一。
#
# 使用（在 cloud_edge_project/edge_service 目录下）：
#   docker compose -f compose.multi-edge.yml up -d --build
#
# Scheduler 需要注册两个节点（在宿主机启动 Scheduler 时设置）：
#   SCHEDULER_EDGE_NODES_JSON='{"edge_001":{"control_url":"http://127.0.0.1:8001","target_topic":"edge/edge_001/input"},"edge_002":{"control_url":"http://127.0.0.1:8002","target_topic":"edge/edge_002/input"}}'
#
# MQTT Broker、Scheduler、Cloud 第一版假设运行在宿主机，
# 可用环境变量 EDGE_MQTT_HOST / SCHEDULER_SERVICE_BASE_URL / CLOUD_SERVICE_BASE_URL 覆盖。

services:
  edge_001:
    build:
      context: ..
      dockerfile: edge_service/Dockerfile
    image: cloud-edge/edge-service:latest
    container_name: edge_001
    environment:
      EDGE_NODE_ID: edge_001
      EDGE_MQTT_HOST: ${EDGE_MQTT_HOST:-host.docker.internal}
      EDGE_MQTT_PORT: "1883"
      EDGE_MQTT_CLIENT_ID: edge_001-runtime
      EDGE_MQTT_INPUT_TOPIC: edge/edge_001/input
      EDGE_MQTT_DEVICE_RESULT_TOPIC: summary/device-results
      SCHEDULER_SERVICE_BASE_URL: ${SCHEDULER_SERVICE_BASE_URL:-http://host.docker.internal:8003}
      CLOUD_SERVICE_BASE_URL: ${CLOUD_SERVICE_BASE_URL:-http://host.docker.internal:18021}
      EDGE_MODEL_ROOT: /app/data/models
      EDGE_MODEL_UPDATE_POLLER_ENABLED: ${EDGE_MODEL_UPDATE_POLLER_ENABLED:-false}
      # ENV-3: 容器化 multi-edge 下资源采集使用 cgroup/container 视角，
      # 读取容器自身 quota/limit 而非宿主机 16 核 / 剩余内存。
      # 若节点运行在独立 VM 而非容器，可显式改为 system。
      EDGE_STATUS_RESOURCE_MODE: ${EDGE_STATUS_RESOURCE_MODE:-cgroup}
    ports:
      - "8001:8001"
      - "8011:8011"
    volumes:
      - edge_001_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  edge_002:
    build:
      context: ..
      dockerfile: edge_service/Dockerfile
    image: cloud-edge/edge-service:latest
    container_name: edge_002
    environment:
      EDGE_NODE_ID: edge_002
      EDGE_MQTT_HOST: ${EDGE_MQTT_HOST:-host.docker.internal}
      EDGE_MQTT_PORT: "1883"
      EDGE_MQTT_CLIENT_ID: edge_002-runtime
      EDGE_MQTT_INPUT_TOPIC: edge/edge_002/input
      EDGE_MQTT_DEVICE_RESULT_TOPIC: summary/device-results
      SCHEDULER_SERVICE_BASE_URL: ${SCHEDULER_SERVICE_BASE_URL:-http://host.docker.internal:8003}
      CLOUD_SERVICE_BASE_URL: ${CLOUD_SERVICE_BASE_URL:-http://host.docker.internal:18021}
      EDGE_MODEL_ROOT: /app/data/models
      EDGE_MODEL_UPDATE_POLLER_ENABLED: ${EDGE_MODEL_UPDATE_POLLER_ENABLED:-false}
      # ENV-3: 容器化 multi-edge 下资源采集使用 cgroup/container 视角。
      EDGE_STATUS_RESOURCE_MODE: ${EDGE_STATUS_RESOURCE_MODE:-cgroup}
    ports:
      - "8002:8001"
      # 8012 保留给宿主机正式模型服务；edge_002 控制端口宿主机映射使用 8013。
      - "8013:8011"
    volumes:
      - edge_002_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  edge_001_data:
  edge_002_data:
