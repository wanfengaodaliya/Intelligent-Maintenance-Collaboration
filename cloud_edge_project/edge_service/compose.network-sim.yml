# 阶段 4：完整网络模拟链路部署（真实 Edge 节点接入网络模拟环境）。
#
# 前置条件：
#   1. 先启动网络模拟器（internet_service/network_simulator 目录）：
#      docker compose up -d
#      它会创建默认网络（通常为 network_simulator_default）并启动
#      toxiproxy / mqtt-broker / network-controller。
#   2. 真实 Scheduler 与 Cloud 运行在宿主机 8003 / 8004 端口
#      （toxiproxy 各链路的上游已指向 host.docker.internal）。
#
# 使用（在 cloud_edge_project/edge_service 目录下）：
#   docker compose -f compose.network-sim.yml up -d --build
#
# 节点命名 edge_01 / edge_02 与网络模拟器 config/links.yaml 中的链路
# （edge_01__to__scheduler__http 等）完全对齐，因此不需要修改网络模拟器配置。
#
# 链路走向：
#   edge_01 → Scheduler : toxiproxy:18011（宿主机 127.0.0.1:18011）
#   edge_01 → Cloud     : toxiproxy:18021（宿主机 127.0.0.1:18021）
#   edge_02 → Scheduler : toxiproxy:18051（宿主机 127.0.0.1:18051）
#   edge_02 → Cloud     : toxiproxy:18053（宿主机 127.0.0.1:18053）
#   Scheduler → edge    : 宿主机 127.0.0.1:18042/18052 → 本文件端口 8001/8002
#   Sender → Edge (MQTT): 宿主机 18831/18832/18931/18932/19031/19032 → mqtt-broker
#
# Scheduler 节点注册（宿主机启动 Scheduler 时设置）：
#   SCHEDULER_EDGE_NODES_JSON='{"edge_01":{"control_url":"http://127.0.0.1:18042","target_topic":"edge/edge_01/input"},"edge_02":{"control_url":"http://127.0.0.1:18052","target_topic":"edge/edge_02/input"}}'
#
# 链路故障责任（阶段 4 约定）：
#   - Sender→Edge 发送失败：由 Sender/Scheduler 重调度；
#   - Edge→Cloud 复核超时：由 Edge 在业务截止时间降级为暂定结果；
#   - Scheduler→Edge 仲裁投递失败：由 Scheduler 重试回调。

services:
  edge_01:
    build:
      context: ..
      dockerfile: edge_service/Dockerfile
    image: cloud-edge/edge-service:latest
    container_name: edge_sim_01
    extra_hosts:
      # 阶段 6：正式模型服务运行在宿主机（WSL），容器经 host-gateway 访问。
      - "host.docker.internal:host-gateway"
    environment:
      EDGE_NODE_ID: edge_01
      EDGE_MQTT_HOST: mqtt-broker
      EDGE_MQTT_PORT: "1883"
      EDGE_MQTT_CLIENT_ID: edge_01-runtime
      EDGE_MQTT_INPUT_TOPIC: edge/edge_01/input
      EDGE_MQTT_DEVICE_RESULT_TOPIC: summary/device-results
      # 出站 HTTP 全部经过 Toxiproxy 链路，指向 links.yaml 中对应代理端口。
      SCHEDULER_SERVICE_BASE_URL: http://toxiproxy:18011
      CLOUD_SERVICE_BASE_URL: http://toxiproxy:18021
      # 正式诊断路线：蒸馏模型 H5 三通道并行（容器内本地推理，镜像自带 torch）。
      # 切回模型服务 HTTP 路线（故障演练矩阵）：EDGE_DIAGNOSTIC_BACKEND=official
      # 并保留 EDGE_MODEL_BASE_URL。
      EDGE_DIAGNOSTIC_BACKEND: ${EDGE_DIAGNOSTIC_BACKEND:-local_h5}
      EDGE_MODEL_BASE_URL: http://host.docker.internal:8012
      # 阶段 7.2（可选）：pin 模型版本；与模型路线 readiness 上报不一致时
      # 本节点 readiness 不通过，调度方停止派发新任务。
      # EDGE_MODEL_VERSION: distilled_h5_kd_fold3_a9f20442
      # 状态上报 URL 从统一基址推导，同样经过 edge→scheduler / edge→cloud 链路。
      EDGE_NETWORK_LINK_ID: edge_01__to__scheduler__http
      EDGE_NETWORK_STATUS_URL: http://network-controller:8090/api/v1/network/links/edge_01__to__scheduler__http
    ports:
      # 供 Scheduler→Edge / Cloud→Edge 链路的 toxiproxy 上游回调。
      - "8001:8001"
      - "8011:8011"
    volumes:
      - edge_01_sim_data:/app/data
    restart: unless-stopped

  edge_02:
    build:
      context: ..
      dockerfile: edge_service/Dockerfile
    image: cloud-edge/edge-service:latest
    container_name: edge_sim_02
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      EDGE_NODE_ID: edge_02
      EDGE_MQTT_HOST: mqtt-broker
      EDGE_MQTT_PORT: "1883"
      EDGE_MQTT_CLIENT_ID: edge_02-runtime
      EDGE_MQTT_INPUT_TOPIC: edge/edge_02/input
      EDGE_MQTT_DEVICE_RESULT_TOPIC: summary/device-results
      SCHEDULER_SERVICE_BASE_URL: http://toxiproxy:18051
      CLOUD_SERVICE_BASE_URL: http://toxiproxy:18053
      EDGE_DIAGNOSTIC_BACKEND: ${EDGE_DIAGNOSTIC_BACKEND:-local_h5}
      EDGE_MODEL_BASE_URL: http://host.docker.internal:8012
      EDGE_NETWORK_LINK_ID: edge_02__to__scheduler__http
      EDGE_NETWORK_STATUS_URL: http://network-controller:8090/api/v1/network/links/edge_02__to__scheduler__http
    ports:
      - "8002:8001"
      - "8012:8011"
    volumes:
      - edge_02_sim_data:/app/data
    restart: unless-stopped

volumes:
  edge_01_sim_data:
  edge_02_sim_data:

networks:
  default:
    name: ${NETWORK_SIM_NETWORK:-network_simulator_default}
    external: true
