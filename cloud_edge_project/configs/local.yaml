mode: local

services:
  edge:
    host: "127.0.0.1"
    port: 8001
  scheduler:
    host: "0.0.0.0"
    port: 8003
  cloud:
    host: "0.0.0.0"
    port: 8004

model:
  # 正式边缘诊断路线：蒸馏模型 H5 三通道并行（本地推理）。
  # official 保留供对照与故障演练（可经 EDGE_DIAGNOSTIC_BACKEND 环境变量
  # 切换）。Edge 身份与 MQTT 连接由 EdgeRuntimeConfig 环境变量/Compose 管理。
  edge_backend: "local_h5"

packet_routing:
  confidence_threshold: 0.80

cloud_node:
  max_queue_length: 5
  status_ttl_seconds: 5
  # 网络模拟器把 edge→cloud 方向建模为 "{edge_id}__to__{link_alias}__http" 链路，
  # 调度器据此把这类 HTTP 链路写入 cloud_registry，供补传派发判断云可达性。
  default_cloud_node_id: "cloud_01"
  link_alias: "cloud"

cloud_network:
  min_uplink_mbps: 2.0
  max_rtt_p95_ms: 100.0
  max_loss_rate: 0.10

deferred_cloud_review:
  retention_hours: 24
  dispatcher_interval_seconds: 1.0
  cleanup_interval_seconds: 60.0

log:
  path: "logs/task_trace.jsonl"

demo:
  network_state:
    latency_ms: 30.0
    bandwidth_mbps: 20.0
    packet_loss: 0.01
    cloud_available: true
  node_state:
    edge_cpu_usage: 0.55
    edge_memory_usage: 0.62
    cloud_queue_length: 3

