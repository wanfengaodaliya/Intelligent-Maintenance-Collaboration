mode: local

services:
  edge:
    host: "127.0.0.1"
    port: 8001
  scheduler:
    host: "127.0.0.1"
    port: 8003
  cloud:
    host: "127.0.0.1"
    port: 8004
  consistency:
    host: "127.0.0.1"
    port: 8005
  log:
    host: "127.0.0.1"
    port: 8006

model:
  edge_backend: "random_forest"
  cloud_backend: "rule"

mqtt:
  host: "127.0.0.1"
  port: 1883
  qos: 1
  input_topic: "edge/edge_01/input"
  client_id: "edge_01-runtime"

bearing_window_transfer:
  cache_directory: "edge_service/data/bearing_windows"
  hard_limit_gib: 20
  warning_gib: 16
  reserved_free_gib: 10
  dispatch_interval_seconds: 1.0

log:
  path: "logs/task_trace.jsonl"

demo:
  network_state:
    latency_ms: 30.0
    bandwidth_mbps: 20.0
    packet_loss: 0.01
    cloud_available: true
  node_state:
    edge_cpu_usage: 0.55
    edge_memory_usage: 0.62
    cloud_queue_length: 3

